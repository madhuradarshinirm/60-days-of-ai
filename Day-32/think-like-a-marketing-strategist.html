<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Think Like a Marketing Strategist: Grow This Brand</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg: #0d1117;
    --bg-elevated: #141b26;
    --panel: #1a2230;
    --panel-2: #202b3d;
    --line: #2a3549;
    --ink: #eef2f8;
    --ink-dim: #a7b3c6;
    --ink-faint: #6c7890;
    --violet: #8b7bff;
    --violet-dim: #6a5cd6;
    --amber: #ffb454;
    --teal: #4fd6c4;
    --rose: #ff7597;
    --font-display: 'Iowan Old Style', 'Georgia', 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(139,123,255,0.14), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(79,214,196,0.08), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;}
  .app-shell{
    max-width:920px;
    margin:0 auto;
    padding:28px 20px 90px;
  }
  ::selection{background:var(--violet-dim);color:#fff;}

  /* ---------- Header / Progress ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:26px;
    gap:16px;
  }
  .brandmark{
    display:flex;align-items:center;gap:10px;
    font-family:var(--font-display);
    font-size:16px;
    color:var(--ink-dim);
    letter-spacing:0.02em;
  }
  .brandmark .dot{width:8px;height:8px;border-radius:50%;background:var(--violet);box-shadow:0 0 12px var(--violet);}
  .progress-track{
    flex:1;
    height:6px;
    background:var(--panel);
    border-radius:99px;
    overflow:hidden;
    border:1px solid var(--line);
    max-width:280px;
    margin-left:20px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--violet),var(--teal));
    transition:width .5s cubic-bezier(.4,0,.2,1);
    border-radius:99px;
  }
  .stage-label{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;}

  /* ---------- Cards / Layout ---------- */
  .card{
    background:linear-gradient(180deg, var(--panel), var(--bg-elevated));
    border:1px solid var(--line);
    border-radius:16px;
    padding:28px;
    margin-bottom:20px;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.5);
    animation:fadeUp .5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  .eyebrow{
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--violet);font-weight:600;margin-bottom:8px;
    display:flex;align-items:center;gap:8px;
  }
  h1{
    font-family:var(--font-display);
    font-size:clamp(28px,5vw,42px);
    line-height:1.1;margin:0 0 12px;font-weight:600;
  }
  h2{
    font-family:var(--font-display);
    font-size:clamp(22px,4vw,28px);
    margin:0 0 10px;font-weight:600;
  }
  h3{font-size:17px;margin:0 0 6px;font-weight:600;color:var(--ink);}
  p{color:var(--ink-dim);line-height:1.6;font-size:15px;}
  .lede{font-size:17px;color:var(--ink-dim);line-height:1.65;}

  .concept-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin:18px 0;
  }
  @media (max-width:640px){ .concept-box{grid-template-columns:1fr;} }
  .concept-tile{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
  }
  .concept-tile .k{
    font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--teal);font-weight:700;margin-bottom:6px;
  }
  .concept-tile p{margin:0;font-size:14px;}

  /* ---------- Buttons ---------- */
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;}
  button{font-family:inherit;cursor:pointer;}
  .btn{
    background:var(--panel-2);
    color:var(--ink);
    border:1px solid var(--line);
    padding:12px 20px;
    border-radius:10px;
    font-size:14px;font-weight:600;
    transition:all .18s ease;
  }
  .btn:hover{border-color:var(--violet);transform:translateY(-1px);background:#25314a;}
  .btn:active{transform:translateY(0);}
  .btn-primary{
    background:linear-gradient(135deg,var(--violet),var(--violet-dim));
    border:1px solid transparent;color:#fff;
    box-shadow:0 8px 20px -8px rgba(139,123,255,0.6);
  }
  .btn-primary:hover{filter:brightness(1.08);border-color:transparent;}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink-dim);}
  .btn-ghost:hover{color:var(--ink);}
  .btn-small{padding:8px 14px;font-size:13px;border-radius:8px;}

  /* ---------- Choice grid ---------- */
  .choice-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
    margin-top:20px;
  }
  .choice-card{
    background:var(--panel-2);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:22px;
    text-align:left;
    transition:all .2s ease;
    display:flex;flex-direction:column;gap:8px;
  }
  .choice-card:hover{border-color:var(--violet);transform:translateY(-3px);box-shadow:0 14px 30px -16px rgba(139,123,255,0.5);}
  .choice-card .icon{font-size:30px;}
  .choice-card .title{font-weight:700;font-size:16px;color:var(--ink);}
  .choice-card .desc{font-size:13px;color:var(--ink-faint);line-height:1.5;}

  /* Selectable pill/toggle cards (platforms, pillars) */
  .pick-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:14px;
    margin:18px 0;
  }
  .pick-card{
    background:var(--panel-2);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:16px;
    cursor:pointer;
    transition:all .15s ease;
    position:relative;
  }
  .pick-card.selected{
    border-color:var(--violet);
    background:linear-gradient(180deg, rgba(139,123,255,0.14), rgba(139,123,255,0.04));
  }
  .pick-card.disabled{opacity:.35;cursor:not-allowed;}
  .pick-card .check{
    position:absolute;top:12px;right:12px;
    width:20px;height:20px;border-radius:50%;
    border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;color:transparent;
  }
  .pick-card.selected .check{background:var(--violet);border-color:var(--violet);color:#fff;}
  .pick-card .title{font-weight:700;font-size:15px;margin-bottom:4px;padding-right:24px;}
  .pick-card .sub{font-size:12.5px;color:var(--ink-faint);line-height:1.5;}
  .pick-card .verdict{
    display:inline-block;margin-top:8px;font-size:11px;font-weight:700;
    padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em;
  }
  .verdict.good{background:rgba(79,214,196,0.15);color:var(--teal);}
  .verdict.maybe{background:rgba(255,180,84,0.15);color:var(--amber);}
  .verdict.poor{background:rgba(255,117,151,0.15);color:var(--rose);}

  /* ---------- Prompt Card ---------- */
  .prompt-card{
    background:var(--bg-elevated);
    border:1px dashed var(--line);
    border-radius:12px;
    padding:18px 20px;
    margin-top:22px;
    position:relative;
  }
  .prompt-card .label{
    font-size:11px;text-transform:uppercase;letter-spacing:.1em;
    color:var(--amber);font-weight:700;margin-bottom:8px;
    display:flex;align-items:center;gap:6px;
  }
  .prompt-text{
    font-family:var(--font-mono);
    font-size:12.5px;
    color:var(--ink-dim);
    background:#0a0f17;
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .copy-btn{
    margin-top:10px;
    font-size:12px;
    padding:6px 12px;
  }

  /* ---------- Info panel (persistent brand snapshot) ---------- */
  .snapshot{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 18px;
    margin-bottom:20px;
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    font-size:13px;
  }
  .snapshot .item b{color:var(--ink);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:2px;}
  .snapshot .item span{color:var(--ink);}

  /* ---------- Roadmap ---------- */
  .week-card{
    border-left:3px solid var(--violet);
    background:var(--panel-2);
    border-radius:0 12px 12px 0;
    padding:16px 18px;
    margin-bottom:12px;
  }
  .week-card .wk-num{font-size:11px;color:var(--teal);font-weight:700;text-transform:uppercase;letter-spacing:.08em;}
  .week-card h3{margin:4px 0 6px;}

  /* ---------- Event scenario ---------- */
  .event-banner{
    background:linear-gradient(135deg, rgba(255,117,151,0.12), rgba(255,180,84,0.08));
    border:1px solid rgba(255,117,151,0.35);
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
  }
  .event-banner .tag{
    display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:.08em;color:var(--rose);margin-bottom:8px;
  }
  .option-card{
    background:var(--panel-2);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:16px;
    margin-bottom:10px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .option-card:hover{border-color:var(--violet);}
  .option-card.chosen{border-color:var(--teal);background:linear-gradient(180deg, rgba(79,214,196,0.1), transparent);}
  .consequence{
    margin-top:14px;
    padding:14px 16px;
    background:var(--bg-elevated);
    border-left:3px solid var(--teal);
    border-radius:0 10px 10px 0;
    font-size:14px;
    color:var(--ink);
    animation:fadeUp .4s ease;
  }

  /* ---------- Growth report ---------- */
  .report-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0;
  }
  @media (max-width:640px){.report-grid{grid-template-columns:1fr;}}
  .report-tile{
    background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
  }
  .report-tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--violet);font-weight:700;margin-bottom:6px;}
  .report-tile p{margin:0;font-size:13.5px;}
  .lesson-item{
    display:flex;gap:12px;align-items:flex-start;
    padding:12px 0;border-bottom:1px solid var(--line);
  }
  .lesson-item:last-child{border-bottom:none;}
  .lesson-num{
    font-family:var(--font-display);font-size:20px;color:var(--teal);font-weight:700;min-width:28px;
  }

  /* ---------- Misc ---------- */
  .tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .chip{
    background:var(--panel-2);border:1px solid var(--line);
    padding:5px 12px;border-radius:99px;font-size:12px;color:var(--ink-dim);
  }
  .chip.accent{border-color:var(--violet);color:var(--violet);}
  .footer-note{text-align:center;color:var(--ink-faint);font-size:12px;margin-top:30px;}
  .divider{height:1px;background:var(--line);margin:22px 0;}
  .textarea-input, .text-input{
    width:100%;
    background:#0a0f17;
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:10px;
    padding:12px 14px;
    font-family:inherit;
    font-size:14px;
    margin-top:8px;
    resize:vertical;
  }
  .textarea-input:focus, .text-input:focus{outline:none;border-color:var(--violet);}
  .field-label{font-size:13px;font-weight:600;color:var(--ink);margin-top:14px;display:block;}
  .warn-text{color:var(--amber);font-size:13px;margin-top:10px;}
  .helper-text{color:var(--ink-faint);font-size:12.5px;margin-top:4px;}

  a{color:var(--teal);}
  @media (max-width:640px){
    .app-shell{padding:18px 14px 70px;}
    .card{padding:20px;}
  }
</style>
</head>

<div id="root"></div>

<script type="text/babel">
const {useState, useMemo, useEffect} = React;

const INDUSTRIES = [
  {industry:"Cold Brew Coffee Startup", audience:"Busy young professionals aged 24-34 who want an energy boost without sugar crashes", budget:"$3,000/month", competitors:"Local roasteries and national canned-coffee brands", challenge:"Nobody outside their neighborhood has heard of them yet."},

  {industry:"Indie Board Game Publisher", audience:"Hobbyist gamers aged 20-40 who back crowdfunding campaigns", budget:"$5,000/month", competitors:"Established publishers with big fan communities", challenge:"Their last game got buried under a flood of similar Kickstarter launches."},
  {industry:"Plant-Based Meal Prep Service", audience:"Health-focused professionals aged 27-45 short on time to cook", budget:"$6,000/month", competitors:"General meal-kit giants and local health food stores", challenge:"People think plant-based food won't actually fill them up."},
  {industry:"Handmade Ceramics Studio", audience:"Home decor enthusiasts aged 25-50 who want one-of-a-kind pieces", budget:"$800/month", competitors:"Mass-market home goods stores and other Etsy ceramicists", challenge:"Beautiful product, but almost zero brand awareness beyond friends and family."},
  {industry:"B2B Project Management Software", audience:"Small business operations managers aged 28-50 juggling too many tools", budget:"$12,000/month", competitors:"Large, well-funded SaaS incumbents", challenge:"Prospects say 'we already use something' before hearing the pitch."},
  {industry:"Local Craft Brewery", audience:"Beer enthusiasts aged 25-45 who value community and local pride", budget:"$2,500/month", competitors:"National craft beer brands now sold in every grocery store", challenge:"Foot traffic is steady but they're invisible outside a 5-mile radius."},

];

const PLATFORM_LIBRARY = {
  instagram:{name:"Instagram", icon:"📸", strengthTags:["visual","lifestyle","b2c"]},
  tiktok:{name:"TikTok", icon:"🎵", strengthTags:["visual","genz","viral"]},
  linkedin:{name:"LinkedIn", icon:"💼", strengthTags:["b2b","professional","authority"]},

  pinterest:{name:"Pinterest", icon:"📌", strengthTags:["visual","planning","discovery"]},

};

const PILLAR_LIBRARY_BUSINESS = [
  {id:"education", name:"Educational Content", goal:"Builds trust", desc:"Teaches the audience something useful related to your product — tips, how-tos, myth-busting."},
  {id:"bts", name:"Behind the Scenes", goal:"Builds connection", desc:"Shows the humans and process behind the brand — makes the business feel real, not corporate."},
  {id:"social_proof", name:"Social Proof", goal:"Builds trust & drives conversion", desc:"Reviews, testimonials, before/afters — lets other people sell for you."},

const PILLAR_LIBRARY_PERSONAL = [
  {id:"thought_leadership", name:"Thought Leadership", goal:"Builds authority", desc:"Sharing your point of view, predictions, and analysis on your field — this is how people start seeing you as an expert."},
  {id:"personal_story", name:"Personal Story", goal:"Builds connection", desc:"The real journey — struggles, turning points, lessons — that makes people root for you, not just follow you."},

const EVENTS_BUSINESS = [
  {
    tag:"Unexpected Opportunity",
    title:"A mid-size influencer in your niche just featured your product in a video — unpaid, unprompted.",
    detail:"Orders are up 40% overnight. Your inbox and DMs are flooded with questions, and a few upset customers whose orders are now delayed.",
    options:[
      {label:"Publicly thank the influencer and lean into the moment with new content", consequence:"You ride the wave. New followers see a brand that's grateful and quick on its feet, and the influencer notices — a bigger, possibly paid collaboration follows. Lesson: momentum rewards brands that respond fast, not perfectly."},
      {label:"Stay quiet and focus only on fulfilling the backlog of orders", consequence:"Operationally sound, but you miss the narrow window when people are paying attention. By the time you post about it, the moment has cooled. Lesson: operations matter, but marketing has a shelf life — timing is part of the strategy."},

  {
    tag:"Sudden Reach",

      {label:"Respond respectfully, clarify your reasoning, and acknowledge any fair points", consequence:"Your credibility grows — disagreeing well, in public, is one of the fastest ways to demonstrate real expertise instead of just claiming it. Lesson: how you handle disagreement is itself part of your personal brand."},
      {label:"Ignore it and hope it blows over", consequence:"For small disagreements this is fine, but here, silence reads as having no answer, and some of the audience quietly sides with the other person. Lesson: avoiding conflict doesn't protect your authority — sometimes it costs it."},
      {label:"Fire back sharply to defend your position", consequence:"It gets short-term attention, but it can make you look defensive rather than confident, and it invites your audience to pick sides rather than learn something. Lesson: sharpness reads as insecurity more often than it reads as strength."},
    ]
  },
  {
    tag:"Credibility Test",
    title:"You get invited onto a mid-size podcast in your niche with almost no lead time to prepare.",
    detail:"It's a real opportunity, but you have less than 48 hours to get ready.",
    options:[
      {label:"Say yes, and quickly prepare 3 clear talking points tied to your niche", consequence:"You show up focused instead of scrambling, and the appearance becomes a strong piece of content and credibility you can reuse for months. Lesson: preparation under time pressure is a skill — a clear point of view is always faster to prepare than a broad one."},
      {label:"Say yes and improvise without much prep", consequence:"It can go fine, but without a clear point you want to land, the conversation drifts and the audience doesn't walk away with a strong impression of you. Lesson: opportunity without a clear message is a missed opportunity."},
      {label:"Decline because you don't feel fully ready", consequence:"It feels safer, but these invitations aren't guaranteed to repeat, and passing signals to your network that you're not available for visibility moments. Lesson: 'ready' is rarely how big opportunities arrive — most people grow into them in public."},
    ]
  },
];

function PromptCard({title, prompt}){
  const [copied, setCopied] = useState(false);

    ta.value = prompt;
    document.body.appendChild(ta);
    ta.select();

    document.body.removeChild(ta);
    setCopied(true);
    setTimeout(()=>setCopied(false), 1800);

  return (
    <div className="prompt-card">
      <div className="label">💡 How to ask Claude — {title}</div>
      <div className="prompt-text">{prompt}</div>
      <button className="btn btn-ghost btn-small copy-btn" onClick={doCopy}>{copied ? "Copied ✓" : "Copy prompt"}</button>

  );
}

function platformVerdict(key, brand){
  const isPersonal = brand.mode === "personal";
  // Weighted logic: personal brands favor linkedin/twitter/youtube/newsletter
  const heavyPersonal = ["linkedin","twitter","youtube","newsletter"];
  const industry = (brand.industry||"").toLowerCase();
  const isB2B = industry.includes("b2b") || industry.includes("software") || industry.includes("saas");
  const isVisualProduct = industry.includes("ceramic") || industry.includes("sneaker") || industry.includes("board game") || industry.includes("coffee") || industry.includes("pet") || industry.includes("meal");

  const verdicts = {
    instagram: isPersonal
      ? {level:"maybe", why:"Useful for visual proof of your work, but not your primary trust-building channel unless your niche is highly visual."}
      : {level: isVisualProduct ? "good" : "maybe", why: isVisualProduct ? "Highly visual product — Instagram is built for exactly this kind of discovery and desire." : "Works if you can make the product visually interesting, but it's not the obvious first choice here."},
    tiktok: isPersonal
      ? {level:"maybe", why:"Great for reach if you're comfortable on camera, but harder to build long-term authority compared to LinkedIn or YouTube."}
      : {level:"good", why:"Short-form video is currently one of the best low-cost ways for a lesser-known brand to get discovered by new audiences."},
    linkedin: isPersonal
      ? {level:"good", why:"The default home for personal brands built on expertise — ideal for thought leadership and being taken seriously in your field."}
      : {level: isB2B ? "good" : "poor", why: isB2B ? "Your buyers are professionals making work decisions — LinkedIn reaches them in that exact mindset." : "Your audience isn't typically making purchase decisions in a professional headspace here — low fit."},
    twitter: isPersonal
      ? {level:"good", why:"Ideal for sharing opinions in real time and building a reputation through conversation, not just polished posts."}
      : {level:"maybe", why:"Good for real-time engagement and customer service, but rarely the main driver of sales for a product like this."},
    youtube: isPersonal
      ? {level:"good", why:"Long-form video is the strongest format for proving deep expertise — it builds trust faster than almost any other platform."}
      : {level:"maybe", why:"Great for tutorials or behind-the-scenes trust-building, but requires more production effort than the budget may support."},
    pinterest: isPersonal
      ? {level:"poor", why:"Pinterest is built for visual discovery and planning, not for establishing personal authority."}
      : {level: isVisualProduct ? "good" : "poor", why: isVisualProduct ? "People use Pinterest to plan purchases — strong fit for a visually inspiring product." : "Low fit unless your product is something people 'plan' or collect ideas around."},
    facebook: isPersonal
      ? {level:"poor", why:"Skews toward an older, more local audience — rarely where personal brand momentum starts today."}
      : {level:"maybe", why:"Useful for reaching a local or older demographic and running targeted ads, but organic reach is limited."},
    newsletter: isPersonal
      ? {level:"good", why:"An owned audience you don't lose to algorithm changes — essential for turning followers into a real, lasting relationship."}
      : {level:"good", why:"Owned channel that isn't at the mercy of an algorithm — great for nurturing existing customers into repeat buyers."},
    reddit: isPersonal
      ? {level:"maybe", why:"Powerful if you're a genuine expert engaging authentically in niche communities — terrible if it feels like self-promotion."}
      : {level:"maybe", why:"Can work for niche products with passionate communities, but self-promotion is punished — requires real participation."},
  };
  return verdicts[key];
}

function buildRoadmap(brand, pillars, library){
  const isPersonal = brand.mode === "personal";
  const pillarNames = pillars.map(id => library.find(p=>p.id===id)?.name).filter(Boolean);

  if(isPersonal){
    return [
      {title:"Define Your POV & Optimize Your Profile", goal:"Foundation before visibility", detail:`Nail down the specific point of view that makes you worth following in ${brand.industry}. Rewrite your bio so a stranger understands your niche and audience in 5 seconds. No posting pressure yet — this week is about clarity, not output.`},
      {title:`Introduce Yourself Through ${pillarNames[0] || "Your First Pillar"}`, goal:"Start building recognition", detail:`Post consistently using your first pillar to give people a reason to remember you. Focus on one clear idea per post rather than trying to say everything at once.`},
      {title:`Deepen Trust With ${pillarNames[1] || "Your Second Pillar"}`, goal:"Build credibility", detail:`Layer in your second pillar to show range without losing focus. Start replying to others in your niche — visibility compounds faster through conversation than broadcasting alone.`},
      {title:`Reinforce With ${pillarNames[2] || "Your Third Pillar"} & Review`, goal:"Establish rhythm", detail:`Bring in your third pillar and look back at what resonated. Double down on the format and topic that got the most genuine engagement, not just likes.`},
    ];
  }

  return [
    {title:"Audience Research & Foundation", goal:"Understand before you post", detail:`Finalize messaging around ${brand.challenge}. Set up profiles/pages on your chosen platforms and make sure branding is consistent across all of them.`},
    {title:`Launch With ${pillarNames[0] || "Your First Pillar"}`, goal:"Build initial awareness", detail:`Introduce the brand through your first pillar. Goal is discovery, not conversion yet — get in front of new eyes.`},
    {title:`Build Trust With ${pillarNames[1] || "Your Second Pillar"}`, goal:"Convert attention into trust", detail:`Shift toward your second pillar to deepen relationships with people who found you in week 2. This is where skeptics start becoming interested.`},
    {title:`Drive Action With ${pillarNames[2] || "Your Third Pillar"} & Review`, goal:"Convert trust into action", detail:`Lean into your third pillar to nudge warmed-up followers toward a purchase or next step. Review what worked and plan month two around it.`},
  ];
}

function Roadmap({brand, pillars, onNext, onBack}){
  const isPersonal = brand.mode === "personal";
  const library = isPersonal ? PILLAR_LIBRARY_PERSONAL : PILLAR_LIBRARY_BUSINESS;
  const weeks = useMemo(()=>buildRoadmap(brand, pillars, library), [brand, pillars]);

  return (
    <div className="card">
      <div className="eyebrow">Lesson 4 · Turning Strategy Into A Plan</div>
      <h2>Your 30-day roadmap</h2>
      <p className="lede">This isn't a list of individual posts — it's a strategic sequence. Each week has a goal that builds on the last, moving the audience from "never heard of you" to "ready to act."</p>

      {weeks.map((w,i)=>(
        <div className="week-card" key={i}>
          <div className="wk-num">Week {i+1} · {w.goal}</div>
          <h3>{w.title}</h3>
          <p style={{margin:0}}>{w.detail}</p>
        </div>
      ))}

      <PromptCard title="Building a content roadmap" prompt={
`I'm planning a 30-day content strategy for ${isPersonal ? `my personal brand, ${brand.name}` : brand.name} in ${brand.industry}.
My chosen content pillars are: ${pillars.map(id=>library.find(p=>p.id===id)?.name).join(", ")}.

Break this into 4 weekly phases with a clear strategic goal for each week (not individual posts) — showing how each week builds toward the next.`
      }/>

      <div className="btn-row">
        <button className="btn btn-ghost" onClick={onBack}>← Back</button>
        <button className="btn btn-primary" onClick={onNext}>Continue to Curveball Event →</button>
      </div>
    </div>
  );
}

/* ============================================================
   STAGE 5: UNEXPECTED EVENT
   ============================================================ */

function UnexpectedEvent({brand, event, chosenOptionIdx, setChosenOptionIdx, onNext, onBack}){
  const isPersonal = brand.mode === "personal";
  return (
    <div className="card">
      <div className="eyebrow">Lesson 5 · Marketing Rarely Goes To Plan</div>
      <h2>An unexpected event just happened</h2>
      <p className="lede">Even the best strategy meets reality. What separates a good marketer from a great one is how they respond when something unplanned happens — not whether they avoid surprises entirely.</p>

      <div className="event-banner">
        <span className="tag">{event.tag}</span>
        <h3 style={{marginBottom:6}}>{event.title}</h3>
        <p style={{margin:0}}>{event.detail}</p>
      </div>

      <h3>How do you respond?</h3>
      {event.options.map((opt, idx)=>(
        <div key={idx} className={"option-card" + (chosenOptionIdx===idx ? " chosen" : "")} onClick={()=>setChosenOptionIdx(idx)}>
          <b>{opt.label}</b>
        </div>
      ))}

      {chosenOptionIdx !== null && (
        <div className="consequence">
          <b>What happens next:</b> {event.options[chosenOptionIdx].consequence}
        </div>
      )}

      <PromptCard title="Navigating a marketing curveball" prompt={
`Something unexpected just happened with ${isPersonal ? `my personal brand (${brand.name})` : `my brand (${brand.name})`}: ${event.title}

Walk me through 2-3 possible ways to respond, and for each one explain the likely short-term and long-term consequence, so I can choose with clear eyes instead of reacting emotionally.`
      }/>

      <div className="btn-row">
        <button className="btn btn-ghost" onClick={onBack}>← Back</button>
        <button className="btn btn-primary" disabled={chosenOptionIdx===null} onClick={onNext}>See Growth Report →</button>
      </div>
    </div>
  );
}

/* ============================================================
   STAGE 6: GROWTH REPORT
   ============================================================ */

function buildReport(brand, platforms, pillars, pillarLibrary, event, chosenOptionIdx){
  const isPersonal = brand.mode === "personal";
  const pillarNames = pillars.map(id=>pillarLibrary.find(p=>p.id===id)?.name).filter(Boolean);
  const platNames = platforms.map(k=>PLATFORM_LIBRARY[k]?.name).filter(Boolean);
  const chosen = event.options[chosenOptionIdx];
  const bestPlatform = platforms.find(k => platformVerdict(k, brand).level === "good") || platforms[0];

  const lessonsPersonal = [
    "Consistency beats intensity — a clear, repeated point of view builds more trust than occasional bursts of high-effort content.",
    "Niche clarity is a magnet, not a limitation — the more specifically people understand what you're known for, the easier you are to recommend.",
    "Authenticity earns the benefit of the doubt — audiences forgive imperfect execution far more easily than they forgive a brand that feels fake.",
  ];
  const lessonsBusiness = [
    "Audience clarity should come before platform choice — the right platform is the one your specific audience already trusts, not the trendiest one.",
    "A small number of content pillars, used consistently, builds recognition faster than constant novelty.",
    "How a brand responds to the unexpected often shapes its reputation more than any planned campaign.",
  ];

  return {
    audienceUnderstanding: `${isPersonal ? "You" : brand.name} are targeting ${brand.audience}. The strongest strategies here will speak directly to their specific frustrations rather than generic, one-size-fits-all messaging.`,
    platformStrategy: `You selected ${platNames.join(", ") || "no platforms"}. ${platNames.length ? `${PLATFORM_LIBRARY[bestPlatform]?.name || "Your top platform"} stands out as the strongest long-term fit given your audience and goals.` : ""}`,
    contentStrategy: `Your three pillars — ${pillarNames.join(", ") || "none selected"} — give you a system: enough variety to stay interesting, focused enough to stay recognizable.`,
    growthPotential: platforms.length >= 2 && pillars.length === 3
      ? "Strong. You've paired a focused platform strategy with a repeatable content system — the combination most likely to compound over time."
      : "Moderate. Consider tightening either your platform choices or your content pillars for a clearer, more compounding growth path.",
    bestDecision: `Choosing ${pillarNames[0] || "a clear first pillar"} as an early focus, since it directly addresses "${brand.challenge}" instead of trying to solve everything at once.`,
    biggestMistake: chosenOptionIdx !== null && chosenOptionIdx !== event.options.findIndex(o=>o===chosen)
      ? "N/A — recorded from your choices below."
      : `The biggest risk in a plan like this is usually spreading across too many platforms too early — watch for that as ${isPersonal ? "you grow" : "this brand scales"}.`,
    lessons: isPersonal ? lessonsPersonal : lessonsBusiness,
  };
}

function GrowthReport({brand, platforms, pillars, pillarLibrary, event, chosenOptionIdx, onRestart}){
  const report = useMemo(()=>buildReport(brand, platforms, pillars, pillarLibrary, event, chosenOptionIdx), [brand, platforms, pillars, event, chosenOptionIdx]);
  const isPersonal = brand.mode === "personal";

  return (
    <div className="card">
      <div className="eyebrow">Final Report · Growth Summary</div>
      <h1 style={{fontSize:"32px"}}>Growth Report: {brand.name}</h1>
      <p className="lede">Here's the strategic picture you built — the same structure a real marketing strategist would use to brief a client or plan their own next quarter.</p>

      <div className="report-grid">
        <div className="report-tile"><div className="k">Audience Understanding</div><p>{report.audienceUnderstanding}</p></div>
        <div className="report-tile"><div className="k">Platform Strategy</div><p>{report.platformStrategy}</p></div>
        <div className="report-tile"><div className="k">Content Strategy</div><p>{report.contentStrategy}</p></div>
        <div className="report-tile"><div className="k">Growth Potential</div><p>{report.growthPotential}</p></div>
        <div className="report-tile"><div className="k">Best Decision</div><p>{report.bestDecision}</p></div>
        <div className="report-tile"><div className="k">Watch Out For</div><p>{report.biggestMistake}</p></div>
      </div>

      <div className="divider"></div>
      <h2 style={{fontSize:"19px"}}>Three Marketing Lessons {isPersonal ? "for your personal brand" : "from this run"}</h2>
      {report.lessons.map((l,i)=>(
        <div className="lesson-item" key={i}>
          <div className="lesson-num">{String(i+1).padStart(2,"0")}</div>
          <p style={{margin:0}}>{l}</p>
        </div>
      ))}

      <div className="tag-row">
        {platforms.map(p=> <span className="chip accent" key={p}>{PLATFORM_LIBRARY[p]?.icon} {PLATFORM_LIBRARY[p]?.name}</span>)}
      </div>

      <PromptCard title="Turning this into a real plan" prompt={
`Based on this simulated strategy for ${isPersonal ? `my personal brand, ${brand.name} (${brand.industry})` : `${brand.name} (${brand.industry})`}:
- Audience: ${brand.audience}
- Platforms: ${platforms.map(k=>PLATFORM_LIBRARY[k]?.name).join(", ")}
- Content pillars: ${pillars.map(id=>pillarLibrary.find(p=>p.id===id)?.name).join(", ")}

Help me turn this into a real, actionable plan for the next 30 days, including specific post ideas for week 1.`
      }/>

      <div className="divider"></div>
      <div className="btn-row">
        <button className="btn btn-primary" onClick={onRestart}>🔁 Try Another Brand</button>
      </div>
      <p className="footer-note">Every run randomizes a new business, so you can practice this thinking with a fresh scenario each time.</p>
    </div>
  );
}

/* ============================================================
   ROOT APP — STATE MACHINE
   ============================================================ */

const STAGES = ["welcome","intake","understand","platforms","pillars","roadmap","event","report"];
const STAGE_LABELS = {
  welcome:"Start", intake:"Setup", understand:"Understand", platforms:"Platforms",
  pillars:"Content", roadmap:"Roadmap", event:"Curveball", report:"Report"
};

function App(){
  const [stage, setStage] = useState("welcome");
  const [entryChoice, setEntryChoice] = useState(null); // business_custom | personal_custom | random
  const [brand, setBrand] = useState(null);
  const [platforms, setPlatforms] = useState([]);
  const [pillars, setPillars] = useState([]);
  const [event, setEvent] = useState(null);
  const [chosenOptionIdx, setChosenOptionIdx] = useState(null);

  const resetAll = () => {
    setStage("welcome");
    setEntryChoice(null);
    setBrand(null);
    setPlatforms([]);
    setPillars([]);
    setEvent(null);
    setChosenOptionIdx(null);
  };

  const handleWelcomeChoice = (choice) => {
    setEntryChoice(choice);
    if(choice === "random"){
      const b = generateRandomBusiness();
      setBrand(b);
      const evs = EVENTS_BUSINESS;
      setEvent(randomOf(evs));
      setStage("understand");
    } else {
      setStage("intake");
    }
  };

  const handleIntakeSubmit = (b) => {
    setBrand(b);
    const evs = b.mode === "personal" ? EVENTS_PERSONAL : EVENTS_BUSINESS;
    setEvent(randomOf(evs));
    setStage("understand");
  };

  const stageIndex = STAGES.indexOf(stage);
  const pillarLibrary = brand && brand.mode === "personal" ? PILLAR_LIBRARY_PERSONAL : PILLAR_LIBRARY_BUSINESS;

  return (
    <div className="app-shell">
      <ProgressBar stage={stageIndex} total={STAGES.length-1} label={STAGE_LABELS[stage]} />
      {brand && stage !== "welcome" && stage !== "intake" && <Snapshot brand={brand} />}

      {stage === "welcome" && <Welcome onChoose={handleWelcomeChoice} />}

      {stage === "intake" && entryChoice === "business_custom" && (
        <BusinessIntake onSubmit={handleIntakeSubmit} onBack={()=>setStage("welcome")} />
      )}
      {stage === "intake" && entryChoice === "personal_custom" && (
        <PersonalIntake onSubmit={handleIntakeSubmit} onBack={()=>setStage("welcome")} />
      )}

      {stage === "understand" && brand && (
        <UnderstandBrand brand={brand} onNext={()=>setStage("platforms")} onBack={()=>setStage(entryChoice==="random" ? "welcome" : "intake")} />
      )}

      {stage === "platforms" && brand && (
        <PlatformStrategy brand={brand} selected={platforms} setSelected={setPlatforms} onNext={()=>setStage("pillars")} onBack={()=>setStage("understand")} />
      )}

      {stage === "pillars" && brand && (
        <ContentPillars brand={brand} chosenPillars={pillars} setChosenPillars={setPillars} onNext={()=>setStage("roadmap")} onBack={()=>setStage("platforms")} />
      )}

      {stage === "roadmap" && brand && (
        <Roadmap brand={brand} pillars={pillars} onNext={()=>setStage("event")} onBack={()=>setStage("pillars")} />
      )}

      {stage === "event" && brand && event && (
        <UnexpectedEvent brand={brand} event={event} chosenOptionIdx={chosenOptionIdx} setChosenOptionIdx={setChosenOptionIdx} onNext={()=>setStage("report")} onBack={()=>setStage("roadmap")} />
      )}

      {stage === "report" && brand && event && chosenOptionIdx !== null && (
        <GrowthReport brand={brand} platforms={platforms} pillars={pillars} pillarLibrary={pillarLibrary} event={event} chosenOptionIdx={chosenOptionIdx} onRestart={resetAll} />
      )}

      <p className="footer-note">Built to teach strategic thinking, not just generate content. Runs fully offline — no data leaves this page.</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
